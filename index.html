            <path d="M126 160 Q130 168 136 162" stroke="#a8704b" stroke-width="3" stroke-linecap="round" fill="none"/>
            <ellipse cx="88" cy="172" rx="11" ry="7" fill="#e07a63" fill-opacity=".28"/><ellipse cx="172" cy="172" rx="11" ry="7" fill="#e07a63" fill-opacity=".28"/>
            <path d="M110 180 Q130 200 150 180 Q130 186 110 180 Z" fill="#7a2f2a" stroke="#7a2f2a" stroke-width="2.4" stroke-linejoin="round"/>
            <path d="M116 184 Q130 191 144 184 Q130 187 116 184 Z" fill="#fff"/>
          </g>
        </g>
        <circle class="sp-nib" r="3.4" cx="-20" cy="-20"></circle>
      </svg>
      <div class="sp-bar" aria-hidden="true"><span></span></div>
      <p class="sp-pct" aria-hidden="true"><b>0</b>%</p>
    </div>
    <script>
      (function () {
        var el = document.getElementById('splash');
        if (!el) return;
        var bar = el.querySelector('.sp-bar span');
        var num = el.querySelector('.sp-pct b');
        var svg = el.querySelector('.sp-scene');
        var nib = el.querySelector('.sp-nib');
        var q = function (s) { return svg.querySelector(s); };
        var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        var seen = false;
        try { seen = !!sessionStorage.getItem('wa-splash'); } catch (e) {}
        var animate = !reduce && !seen; // first visit: the character writes the name; later visits: finished picture

        // ---- Timing (ms)
        var WRITE_DELAY = 450; // hand rises to the start point
        var WRITE_MS = 1900;   // time to write the whole name
        var GAP = 40;          // pen-lift pause between strokes
        var MIN = animate ? 0 : reduce ? 300 : 700; // shortest time the screen stays (set below when animating)
        var MAX = 5000;        // never keep the visitor waiting longer than this
        var FRAMES = 36;       // hero frames warmed up while loading

        // ---- Geometry (scene units). Name placement must match the <g class="sp-write"> transform.
        var NX = 60, NY = 232, NS = 0.62;
        var SX = 78, SY = 254;      // shoulder of the writing arm (body-local)
        var L1 = 52, L2 = 50;       // upper arm, forearm
        var HAND = { x: 16, y: -24 }; // hand position relative to the pen tip
        var REST = { x: -10, y: 92 }; // resting hand relative to the shoulder
        var FOLLOW = -23;           // body offset = pen x + FOLLOW (keeps the pen just left of the body)

        var started = Date.now();
        var finished = false;
        var loadDone = document.readyState === 'complete';
        var fontsDone = false;
        var frames = 0;
        var shown = 0;
        var keep = [];

        function stop(e) { if (e.cancelable) e.preventDefault(); }
        el.addEventListener('wheel', stop, { passive: false });
        el.addEventListener('touchmove', stop, { passive: false });

        // ---- Handwriting plan: every stroke is drawn by its length
        var strokes = Array.prototype.slice.call(svg.querySelectorAll('.sp-write path'));
        var plan = [], writeEnd = 0, tipStart = { x: NX, y: NY }, tipEnd = { x: NX, y: NY };
        function toScene(p, pt) { return { x: NX + NS * pt.x, y: NY + NS * pt.y }; }
        try {
          var total = 0, lens = [], i, gaps = [], pts = [], gapSum = 0;
          for (i = 0; i < strokes.length; i++) {
            lens[i] = strokes[i].getTotalLength(); total += lens[i];
            pts[i] = { a: toScene(null, strokes[i].getPointAtLength(0)), b: toScene(null, strokes[i].getPointAtLength(lens[i])) };
          }
          for (i = 0; i < strokes.length - 1; i++) {
            // pen-up travel to the next stroke takes time in proportion to the distance
            var jx = pts[i + 1].a.x - pts[i].b.x, jy = pts[i + 1].a.y - pts[i].b.y;
            gaps[i] = clamp(Math.sqrt(jx * jx + jy * jy) / 1.1, GAP, 170);
            gapSum += gaps[i];
          }
          var drawMs = WRITE_MS - gapSum, t = 0;
          for (i = 0; i < strokes.length; i++) {
            var dur = Math.max(110, drawMs * lens[i] / total);
            plan.push({ p: strokes[i], len: lens[i], start: t, dur: dur, a: pts[i].a, b: pts[i].b });
            t += dur + (i < strokes.length - 1 ? gaps[i] : 0);
            strokes[i].style.strokeDasharray = lens[i];
            strokes[i].style.strokeDashoffset = animate ? lens[i] : 0;
          }
          writeEnd = t;
          tipStart = pts[0].a;
          tipEnd = pts[strokes.length - 1].b;
          if (animate) MIN = WRITE_DELAY + writeEnd + 700; // hold the finished picture a moment
        } catch (err) {
          plan = []; animate = false; MIN = 700;
          for (var k = 0; k < strokes.length; k++) { strokes[k].style.strokeDasharray = ''; strokes[k].style.strokeDashoffset = ''; }
        }
        var writeStart = started + WRITE_DELAY;
        var DX0 = tipStart.x + FOLLOW - 0; // body offset at the start

        // ---- Character parts
        var ch = q('.ch'), head = q('.ch-head'), legL = q('.ch-legL'), legR = q('.ch-legR');
        var aSleeve = q('.a-sleeve'), aUpper = q('.a-upper'), aFore = q('.a-fore'), aPen = q('.a-pen'), aNib = q('.a-nib'), aHand = q('.a-hand');
        var eyes = Array.prototype.slice.call(svg.querySelectorAll('.ch-eye'));
        var pupils = Array.prototype.slice.call(svg.querySelectorAll('.ch-pupil, .ch-glint'));

        function ease(x) { return x <= 0 ? 0 : x >= 1 ? 1 : x * x * (3 - 2 * x); }
        function clamp(x, a, b) { return x < a ? a : x > b ? b : x; }
        function line(l, x1, y1, x2, y2) {
          l.setAttribute('x1', x1.toFixed(1)); l.setAttribute('y1', y1.toFixed(1));
          l.setAttribute('x2', x2.toFixed(1)); l.setAttribute('y2', y2.toFixed(1));
        }

        // Two-bone arm: find the elbow so both bones keep their length (the hand is clamped to the reach)
        function arm(hx, hy) {
          var dxs = hx - SX, dys = hy - SY, d = Math.sqrt(dxs * dxs + dys * dys) || 0.001;
          var maxd = L1 + L2 - 0.5, mind = Math.abs(L1 - L2) + 0.5;
          if (d > maxd) { hx = SX + dxs / d * maxd; hy = SY + dys / d * maxd; d = maxd; }
          else if (d < mind) { hx = SX + dxs / d * mind; hy = SY + dys / d * mind; d = mind; }
          var ux = (hx - SX) / d, uy = (hy - SY) / d;
          var a = (L1 * L1 - L2 * L2 + d * d) / (2 * d), h = Math.sqrt(Math.max(0, L1 * L1 - a * a));
          var c1 = { x: SX + ux * a - uy * h, y: SY + uy * a + ux * h };
          var c2 = { x: SX + ux * a + uy * h, y: SY + uy * a - ux * h };
          var e = (-c1.x * 0.6 + c1.y * 0.8) >= (-c2.x * 0.6 + c2.y * 0.8) ? c1 : c2; // elbow down and outward
          return { ex: e.x, ey: e.y, hx: hx, hy: hy };
        }

        // ---- State
        var dx = animate ? DX0 : tipEnd.x + FOLLOW;
        var lastNow = Date.now(), phase = 0, amp = 0;
        var nextBlink = lastNow + 1200, blinkAt = -1;
        var tip = { x: animate ? tipStart.x : tipEnd.x, y: animate ? tipStart.y : tipEnd.y };

        function pose(now, dt) {
          // 1) where is the pen, and is it on the paper?
          var e = now - writeStart, down = false, lift = 0, j, f;
          if (animate && plan.length) {
            for (j = 0; j < plan.length; j++) {
              f = clamp((e - plan[j].start) / plan[j].dur, 0, 1);
              plan[j].p.style.strokeDashoffset = plan[j].len * (1 - f);
            }
            if (e <= 0) { tip = plan[0].a; }
            else if (e >= writeEnd) { tip = plan[plan.length - 1].b; lift = 1; }
            else {
              for (j = 0; j < plan.length; j++) {
                var s0 = plan[j].start, s1 = s0 + plan[j].dur;
                if (e >= s0 && e <= s1) {
                  down = true;
                  tip = toScene(null, plan[j].p.getPointAtLength(plan[j].len * (e - s0) / plan[j].dur));
                  break;
                }
                if (j < plan.length - 1 && e > s1 && e < plan[j + 1].start) {
                  var gp = (e - s1) / (plan[j + 1].start - s1), gk = ease(gp);
                  tip = { x: plan[j].b.x + (plan[j + 1].a.x - plan[j].b.x) * gk, y: plan[j].b.y + (plan[j + 1].a.y - plan[j].b.y) * gk };
                  lift = Math.sin(Math.PI * gp);
                  break;
                }
              }
            }
          }
          var blend = !animate ? 0 : e < 0 ? ease((e + WRITE_DELAY) / WRITE_DELAY) : e > writeEnd ? ease(1 - (e - writeEnd) / 450) : 1;

          // nib = the ink point, only while the pen touches
          if (nib) {
            nib.setAttribute('cx', tip.x.toFixed(1)); nib.setAttribute('cy', tip.y.toFixed(1));
            nib.style.opacity = animate && down ? '1' : '0';
          }

          // 2) the body follows the pen to the right, taking steps
          var k = 1 - Math.exp(-dt * 12);
          var prev = dx;
          if (animate && e > -WRITE_DELAY / 2 && e < writeEnd + 200) dx = Math.max(dx, dx + (tip.x + FOLLOW - dx) * k);
          var moved = dx - prev;
          phase += moved * 0.12;
          amp += ((dt > 0 && moved / dt > 8 ? 1 : 0) - amp) * (1 - Math.exp(-dt * 10));
          var bob = -Math.abs(Math.sin(phase)) * 3.2 * amp - Math.sin(now / 520) * 0.8;
          var swing = 17 * amp * Math.sin(phase);
          ch.setAttribute('transform', 'translate(' + dx.toFixed(1) + ' ' + bob.toFixed(1) + ')');
          legL.setAttribute('transform', 'rotate(' + swing.toFixed(1) + ' 106 340)');
          legR.setAttribute('transform', 'rotate(' + (-swing).toFixed(1) + ' 154 340)');

          // 3) arm: the hand follows the pen tip (body-local coordinates)
          var tx = tip.x - dx, ty = tip.y - bob;
          var workX = tx + HAND.x, workY = ty + HAND.y - lift * 14;
          var restX = SX + REST.x, restY = SY + REST.y;
          var hx = restX + (workX - restX) * blend, hy = restY + (workY - restY) * blend;
          var a = arm(hx, hy);
          var mx = SX + (a.ex - SX) * 0.55, my = SY + (a.ey - SY) * 0.55;
          line(aSleeve, SX, SY, mx, my);
          line(aUpper, mx, my, a.ex, a.ey);
          line(aFore, a.ex, a.ey, a.hx, a.hy);
          aHand.setAttribute('cx', a.hx.toFixed(1)); aHand.setAttribute('cy', a.hy.toFixed(1));
          // pen: from behind the fist down to the tip (only while the arm is working)
          var penOn = blend > 0.35;
          var px = a.hx + 7, py = a.hy - 10;
          var tipX = penOn ? tx : a.hx - 6, tipY = penOn ? ty - lift * 14 : a.hy + 20;
          var pdx = tipX - px, pdy = tipY - py, pl = Math.sqrt(pdx * pdx + pdy * pdy) || 1;
          line(aPen, px, py, tipX - pdx / pl * 7, tipY - pdy / pl * 7);
          line(aNib, tipX - pdx / pl * 7, tipY - pdy / pl * 7, tipX, tipY);
          aPen.style.opacity = aNib.style.opacity = penOn ? '1' : '0';

          // 4) head and eyes look at the pen; blinking
          var look = clamp((tip.x - (130 + dx)) / 110, -1, 0.4);
          var lookY = clamp((tip.y - 146) / 80, -0.3, 1);
          head.setAttribute('transform', 'rotate(' + (look * 6).toFixed(1) + ' 130 222)');
          for (var m = 0; m < pupils.length; m++) {
            pupils[m].setAttribute('cx', (parseFloat(pupils[m].getAttribute('data-x')) + look * 5).toFixed(1));
            pupils[m].setAttribute('cy', (parseFloat(pupils[m].getAttribute('data-y')) + lookY * 3.5).toFixed(1));
          }
          var sy = 1;
          if (now >= nextBlink) { blinkAt = now; nextBlink = now + 2300 + Math.random() * 1800; }
          if (blinkAt > 0 && now - blinkAt < 140) sy = Math.max(0.08, 1 - Math.sin(Math.PI * (now - blinkAt) / 140));
          for (var n2 = 0; n2 < eyes.length; n2++) {
            var cx = eyes[n2].getAttribute('data-cx'), cy = eyes[n2].getAttribute('data-cy');
            eyes[n2].setAttribute('transform', 'translate(' + cx + ' ' + cy + ') scale(1 ' + sy.toFixed(2) + ') translate(-' + cx + ' -' + cy + ')');
          }
        }

        if (!loadDone) window.addEventListener('load', function () { loadDone = true; });

        var fonts = document.fonts;
        if (fonts && fonts.load) {
          Promise.all([fonts.load('800 1em "Inter Tight"'), fonts.load('italic 1em "Instrument Serif"')]).then(
            function () { fontsDone = true; },
            function () { fontsDone = true; }
          );
          setTimeout(function () { fontsDone = true; }, 2500);
        } else {
          fontsDone = true;
        }

        function count() { frames++; }
        for (var nn = 2; nn <= FRAMES; nn++) {
          var im = new Image();
          im.onload = count;
          im.onerror = count;
          im.src = '/hero/desktop/frame-' + ('00' + nn).slice(-3) + '.webp';
          keep.push(im);
        }

        function target() {
          return (fontsDone ? 0.2 : 0) + (loadDone ? 0.3 : 0) + 0.5 * Math.min(1, frames / (FRAMES - 1));
        }

        function finish() {
          if (finished) return;
          finished = true;
          try { sessionStorage.setItem('wa-splash', '1'); } catch (e) {}
          for (var m2 = 0; m2 < plan.length; m2++) plan[m2].p.style.strokeDashoffset = 0; // never leave the name half written
          if (nib) nib.style.opacity = '0';
          if (bar) bar.style.transform = 'scaleX(1)';
          if (num) num.textContent = '100';
          el.classList.add('is-done');
          window.dispatchEvent(new Event('splash:done'));
          setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, 800);
        }

        pose(started, 0.016); // first picture before the first frame is painted

        function tick() {
          if (finished) return;
          var now = Date.now(), dt = Math.min(0.05, (now - lastNow) / 1000);
          lastNow = now;
          if (!reduce) pose(now, dt);
          var tg = target();
          shown += (tg - shown) * 0.1;
          if (tg >= 1 && shown > 0.985) shown = 1;
          if (bar) bar.style.transform = 'scaleX(' + shown.toFixed(3) + ')';
          if (num) num.textContent = Math.round(shown * 100);
          var elapsed = now - started;
          if ((shown >= 1 && elapsed >= MIN) || elapsed >= MAX) finish();
          else requestAnimationFrame(tick);
        }
        requestAnimationFrame(tick);
        setTimeout(finish, MAX + 500); // safety net if the tab is in the background
      })();
    </script>
    <!-- splash:end -->
