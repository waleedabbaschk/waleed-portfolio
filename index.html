          setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, 800);
        }

        function tick() {
          if (finished) return;
          paintWrite(Date.now());
          var tg = target();
          shown += (tg - shown) * 0.1;
          if (tg >= 1 && shown > 0.985) shown = 1;
          if (bar) bar.style.transform = 'scaleX(' + shown.toFixed(3) + ')';
          if (num) num.textContent = Math.round(shown * 100);
          var elapsed = Date.now() - started;
          if ((shown >= 1 && elapsed >= MIN) || elapsed >= MAX) finish();
          else requestAnimationFrame(tick);
        }
        requestAnimationFrame(tick);
        setTimeout(finish, MAX + 500); // safety net if the tab is in the background
      })();
    </script>
