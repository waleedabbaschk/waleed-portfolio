    <style id="splash-css">
      html{background:#f5f1e8}
      #splash{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;background:#f5f1e8;color:#12121f;font-family:"Inter Tight",system-ui,sans-serif;transition:opacity .6s ease,visibility .6s ease,transform .6s ease}
      #splash.is-done{opacity:0;visibility:hidden;transform:scale(1.02)}
      #splash::before{content:"";position:absolute;inset:0;background:radial-gradient(60% 45% at 50% 48%,rgba(244,236,196,.9),rgba(245,241,232,0) 70%)}
      #splash>*{position:relative}
      .sp-ghost{position:absolute !important;left:0;right:0;top:50%;margin:0;transform:translateY(-62%);text-align:center;white-space:nowrap;font-size:10.5vw;font-weight:800;letter-spacing:-.04em;line-height:1;color:rgba(18,18,31,.055);user-select:none}
      .sp-stage{height:min(50svh,480px);aspect-ratio:221/644;perspective:900px}
      .sp-char{display:block;width:100%;height:100%;transform-origin:50% 92%;animation:sp-sway 3.4s ease-in-out infinite;will-change:transform}
      .sp-shadow{width:min(46vw,190px);height:16px;margin-top:-8px;border-radius:50%;background:radial-gradient(ellipse at center,rgba(18,18,31,.3),rgba(18,18,31,0) 70%);animation:sp-shadow 3.4s ease-in-out infinite}
      .sp-name{margin:1.1rem 0 0;font-size:clamp(2rem,7.5vw,3.6rem);font-weight:800;letter-spacing:-.04em;line-height:1;white-space:nowrap}
      .sp-name span{display:inline-block;opacity:0;animation:sp-rise .7s cubic-bezier(.2,.8,.2,1) forwards;animation-delay:calc(var(--i)*70ms + 150ms)}
      .sp-name i{font-family:"Instrument Serif",Georgia,serif;font-weight:400;font-style:italic;font-size:1.08em}
      .sp-bar{width:min(58vw,250px);height:2px;margin-top:1.4rem;overflow:hidden;border-radius:2px;background:rgba(18,18,31,.12)}
      .sp-bar span{display:block;width:100%;height:100%;background:#12121f;transform-origin:left;transform:scaleX(0)}
      .sp-pct{margin:.8rem 0 0;font-size:11px;letter-spacing:.3em;text-transform:uppercase;color:#737373;font-variant-numeric:tabular-nums}
      .sp-pct b{font-weight:500}
      @keyframes sp-sway{0%,100%{transform:translateY(0) rotateY(-12deg)}50%{transform:translateY(-10px) rotateY(12deg)}}
      @keyframes sp-shadow{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(.82);opacity:.7}}
      @keyframes sp-rise{from{opacity:0;transform:translateY(.55em)}to{opacity:1;transform:none}}
      @media (prefers-reduced-motion:reduce){.sp-char,.sp-shadow{animation:none}.sp-name span{animation:none;opacity:1}#splash{transition:none}}
    </style>
  </head>
  <body>
    <div id="splash" role="status" aria-live="polite" aria-label="Loading the Malikwaleed portfolio">
      <p class="sp-ghost" aria-hidden="true">MALIKWALEED</p>
      <div class="sp-stage" aria-hidden="true">
        <img class="sp-char" src="/hero/desktop/frame-001.webp" width="221" height="644" alt="" decoding="async" fetchpriority="high" />
      </div>
      <div class="sp-shadow" aria-hidden="true"></div>
      <p class="sp-name" aria-hidden="true"><span style="--i:0">M</span><span style="--i:1">a</span><span style="--i:2">l</span><span style="--i:3">i</span><span style="--i:4">k</span><i><span style="--i:5">w</span><span style="--i:6">a</span><span style="--i:7">l</span><span style="--i:8">e</span><span style="--i:9">e</span><span style="--i:10">d</span></i></p>
      <div class="sp-bar" aria-hidden="true"><span></span></div>
      <p class="sp-pct" aria-hidden="true"><b>0</b>%</p>
    </div>
    <script>
      (function () {
        var el = document.getElementById('splash');
        if (!el) return;
        var bar = el.querySelector('.sp-bar span');
        var num = el.querySelector('.sp-pct b');
        var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        var seen = false;
        try { seen = !!sessionStorage.getItem('wa-splash'); } catch (e) {}
        var MIN = reduce ? 300 : seen ? 700 : 1600; // shortest time the screen stays (ms)
        var MAX = 5000; // never keep the visitor waiting longer than this (ms)
        var FRAMES = 36; // hero frames warmed up while loading
        var started = Date.now();
        var finished = false;
        var loadDone = document.readyState === 'complete';
        var fontsDone = false;
        var frames = 0;
        var shown = 0;
        var keep = [];

        // The page behind must not scroll while the screen is up
        function stop(e) { if (e.cancelable) e.preventDefault(); }
        el.addEventListener('wheel', stop, { passive: false });
        el.addEventListener('touchmove', stop, { passive: false });

        if (!loadDone) window.addEventListener('load', function () { loadDone = true; });

        var fonts = document.fonts;
        if (fonts && fonts.load) {
          Promise.all([fonts.load('800 1em "Inter Tight"'), fonts.load('italic 1em "Instrument Serif"')]).then(
            function () { fontsDone = true; },
            function () { fontsDone = true; }
          );
          setTimeout(function () { fontsDone = true; }, 2500);
        } else {
          fontsDone = true;
        }

        function count() { frames++; }
        for (var i = 2; i <= FRAMES; i++) {
          var im = new Image();
          im.onload = count;
          im.onerror = count;
          im.src = '/hero/desktop/frame-' + ('00' + i).slice(-3) + '.webp';
          keep.push(im);
        }

        function target() {
          return (fontsDone ? 0.2 : 0) + (loadDone ? 0.3 : 0) + 0.5 * Math.min(1, frames / (FRAMES - 1));
        }

        function finish() {
          if (finished) return;
          finished = true;
          try { sessionStorage.setItem('wa-splash', '1'); } catch (e) {}
          if (bar) bar.style.transform = 'scaleX(1)';
          if (num) num.textContent = '100';
          el.classList.add('is-done');
          window.dispatchEvent(new Event('splash:done'));
          setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, 800);
        }

        function tick() {
          if (finished) return;
          var t = target();
          shown += (t - shown) * 0.1;
          if (t >= 1 && shown > 0.985) shown = 1;
          if (bar) bar.style.transform = 'scaleX(' + shown.toFixed(3) + ')';
          if (num) num.textContent = Math.round(shown * 100);
          var elapsed = Date.now() - started;
          if ((shown >= 1 && elapsed >= MIN) || elapsed >= MAX) finish();
          else requestAnimationFrame(tick);
        }
        requestAnimationFrame(tick);
        setTimeout(finish, MAX + 500); // safety net if the tab is in the background
      })();
    </script>
